<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern To-Do Task Manager | Pushti.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar with Return Navigation -->
  <header class="top-nav">
    <div class="top-nav-container">
      <a href="../../index.html#projects" class="btn-back">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Portfolio</span>
      </a>
      <div class="nav-title-group">
        <span>To-Do Application</span>
        <span class="nav-badge">Live Application</span>
      </div>
    </div>
  </header>

  <main class="todo-container">
    
    <div class="todo-header">
      <h1 class="todo-title">Task Flow Manager</h1>
      <p class="todo-subtitle">A clean student task manager with priority tags, status filtering, and local storage sync</p>
    </div>

    <!-- Statistics Counters -->
    <div class="stats-row">
      <div class="stat-card">
        <div>
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value" id="totalTasksCount">0</div>
        </div>
        <i class="bi bi-list-task" style="font-size: 1.75rem; color: var(--primary);"></i>
      </div>

      <div class="stat-card">
        <div>
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="pendingTasksCount" style="color: #f59e0b;">0</div>
        </div>
        <i class="bi bi-hourglass-split" style="font-size: 1.75rem; color: #f59e0b;"></i>
      </div>

      <div class="stat-card">
        <div>
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="completedTasksCount" style="color: #10b981;">0</div>
        </div>
        <i class="bi bi-check2-circle" style="font-size: 1.75rem; color: #10b981;"></i>
      </div>
    </div>

    <!-- Add Task Card -->
    <section class="add-task-card">
      <form id="addTaskForm">
        
        <div class="task-input-row">
          <input type="text" id="taskTitleInput" class="task-input" placeholder="What task do you need to accomplish?..." required>
          <button type="submit" class="btn-add-task">
            <i class="bi bi-plus-lg"></i>
            <span>Add Task</span>
          </button>
        </div>

        <div class="task-options-row">
          <div>
            <label for="prioritySelect" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-right: 6px;">Priority:</label>
            <select id="prioritySelect" class="select-meta">
              <option value="high">High Priority</option>
              <option value="medium" selected>Medium Priority</option>
              <option value="low">Low Priority</option>
            </select>
          </div>

          <div>
            <label for="categorySelect" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-right: 6px;">Category:</label>
            <select id="categorySelect" class="select-meta">
              <option value="College" selected>College</option>
              <option value="Coding">Coding</option>
              <option value="Study">Study</option>
              <option value="Personal">Personal</option>
            </select>
          </div>
        </div>

      </form>
    </section>

    <!-- Filter Buttons Bar -->
    <div class="filter-bar">
      <div class="filter-buttons">
        <button type="button" class="btn-filter active" data-filter="all">All</button>
        <button type="button" class="btn-filter" data-filter="active">Active</button>
        <button type="button" class="btn-filter" data-filter="completed">Completed</button>
      </div>
      <button type="button" class="btn-clear-completed" id="clearCompletedBtn">Clear Completed</button>
    </div>

    <!-- Tasks List Container -->
    <div class="task-list" id="tasksList">
      <!-- Generated via script.js -->
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
