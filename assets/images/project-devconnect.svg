<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="primaryBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#8b5cf6" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGrad4)" />

  <g filter="url(#shadow4)">
    <rect x="40" y="35" width="520" height="290" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Navbar -->
    <rect x="40" y="35" width="520" height="42" rx="12" fill="#18181b" />
    <circle cx="65" cy="56" r="5" fill="#ef4444" />
    <circle cx="81" cy="56" r="5" fill="#eab308" />
    <circle cx="97" cy="56" r="5" fill="#22c55e" />
    <text x="130" y="61" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">DevConnect • Community</text>
    <rect x="430" y="44" width="110" height="24" rx="12" fill="url(#primaryBadge)" />
    <text x="485" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">+ Find Teammates</text>

    <!-- Post 1 -->
    <rect x="65" y="95" width="470" height="95" rx="8" fill="#18181b" stroke="#27272a" />
    <circle cx="95" cy="125" r="16" fill="#6366f1" />
    <text x="95" y="130" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PD</text>
    <text x="125" y="122" fill="#f4f4f5" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">Pushti Dhupelia <tspan fill="#a1a1aa" font-weight="normal">• 10m ago</tspan></text>
    <text x="125" y="142" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="11.5">Building an AI Web Assistant using Bootstrap 5 &amp; Vanilla JS. Looking for UI contributors!</text>
    
    <!-- Tags -->
    <rect x="125" y="153" width="75" height="20" rx="10" fill="#27272a" />
    <text x="162" y="167" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">#javascript</text>
    <rect x="208" y="153" width="75" height="20" rx="10" fill="#27272a" />
    <text x="245" y="167" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">#bootstrap5</text>
    <rect x="290" y="153" width="75" height="20" rx="10" fill="#27272a" />
    <text x="327" y="167" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">#hackathon</text>

    <!-- Post 2 -->
    <rect x="65" y="202" width="470" height="95" rx="8" fill="#18181b" stroke="#27272a" />
    <circle cx="95" cy="232" r="16" fill="#10b981" />
    <text x="95" y="237" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">AL</text>
    <text x="125" y="229" fill="#f4f4f5" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">Alex Lin <tspan fill="#a1a1aa" font-weight="normal">• 2h ago</tspan></text>
    <text x="125" y="249" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="11.5">Just published open-source CSS micro-interaction library. Check out the demo &amp; star!</text>
    
    <rect x="125" y="260" width="85" height="20" rx="10" fill="#27272a" />
    <text x="167" y="274" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">#opensource</text>
    <rect x="218" y="260" width="75" height="20" rx="10" fill="#27272a" />
    <text x="255" y="274" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">#css-magic</text>
  </g>
</svg>
