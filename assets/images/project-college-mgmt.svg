<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cmAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="flutterBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#cmBg)" />
  <circle cx="120" cy="90" r="110" fill="#4f46e5" opacity="0.15" filter="blur(30px)" />
  <circle cx="480" cy="260" r="120" fill="#0284c7" opacity="0.15" filter="blur(35px)" />

  <!-- Mobile Device Mockup (Flutter App) -->
  <g filter="url(#cmShadow)" transform="translate(190, 20)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="220" height="320" rx="24" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    <!-- Screen -->
    <rect x="10" y="10" width="200" height="300" rx="18" fill="#1e293b" />
    
    <!-- Status Bar / Notch -->
    <rect x="75" y="14" width="50" height="4" rx="2" fill="#475569" />
    
    <!-- App Header -->
    <rect x="18" y="26" width="184" height="40" rx="10" fill="url(#cmAccent)" />
    <circle cx="36" cy="46" r="10" fill="#ffffff" opacity="0.2" />
    <text x="54" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">Indus Portal</text>
    <text x="54" y="54" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-size="8">B.Tech CSE • Sem IV</text>
    
    <!-- Quick Stats Cards -->
    <rect x="18" y="74" width="88" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="26" y="90" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="8">Attendance</text>
    <text x="26" y="108" fill="#10b981" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">94.2%</text>

    <rect x="114" y="74" width="88" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="122" y="90" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="8">Current CGPA</text>
    <text x="122" y="108" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">8.85</text>

    <!-- Today's Schedule -->
    <text x="20" y="136" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9">TODAY'S LECTURES</text>
    
    <!-- Class 1 -->
    <rect x="18" y="144" width="184" height="34" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="30" cy="161" r="4" fill="#6366f1" />
    <text x="42" y="157" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">Data Structures &amp; Algo</text>
    <text x="42" y="169" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="7.5">10:00 AM - 11:30 AM • Lab 3</text>

    <!-- Class 2 -->
    <rect x="18" y="184" width="184" height="34" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="30" cy="201" r="4" fill="#0284c7" />
    <text x="42" y="197" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">Database Management</text>
    <text x="42" y="209" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="7.5">12:00 PM - 01:00 PM • Room 204</text>

    <!-- Class 3 -->
    <rect x="18" y="224" width="184" height="34" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="30" cy="241" r="4" fill="#10b981" />
    <text x="42" y="237" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">Software Engineering</text>
    <text x="42" y="249" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="7.5">02:00 PM - 03:00 PM • Room 108</text>

    <!-- Bottom Nav Bar -->
    <rect x="10" y="270" width="200" height="40" rx="0" fill="#0f172a" />
    <circle cx="50" cy="288" r="6" fill="#6366f1" />
    <circle cx="110" cy="288" r="4" fill="#64748b" />
    <circle cx="170" cy="288" r="4" fill="#64748b" />
  </g>

  <!-- Floating Flutter Badge Left -->
  <g transform="translate(60, 110)">
    <rect width="105" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <path d="M 22 13 L 34 25 L 30 29 L 18 17 Z" fill="#38bdf8" />
    <path d="M 26 29 L 30 33 L 24 37 L 20 33 Z" fill="#0284c7" />
    <text x="40" y="27" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">Flutter</text>
  </g>

  <!-- Floating Notice Badge Right -->
  <g transform="translate(435, 170)">
    <rect width="115" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="22" r="7" fill="#10b981" opacity="0.2" />
    <circle cx="20" cy="22" r="3.5" fill="#10b981" />
    <text x="35" y="21" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="10">Exam Notices</text>
    <text x="35" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="8">Updated Today</text>
  </g>
</svg>
