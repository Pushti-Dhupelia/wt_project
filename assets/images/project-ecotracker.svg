<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281e" />
      <stop offset="100%" stop-color="#021f15" />
    </linearGradient>
    <linearGradient id="greenGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGrad3)" />

  <g filter="url(#shadow3)">
    <rect x="40" y="35" width="520" height="290" rx="12" fill="#0b1b15" stroke="#134e3f" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="40" y="35" width="520" height="42" rx="12" fill="#0f2e25" />
    <circle cx="65" cy="56" r="5" fill="#f87171" />
    <circle cx="81" cy="56" r="5" fill="#fbbf24" />
    <circle cx="97" cy="56" r="5" fill="#34d399" />
    <text x="130" y="61" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">🌱 EcoTracker Analytics Dashboard</text>
    
    <!-- Metrics card 1 -->
    <rect x="65" y="95" width="140" height="90" rx="8" fill="#123328" stroke="#195442" />
    <text x="80" y="120" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="11">CO₂ Offset Total</text>
    <text x="80" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="22">428 kg</text>
    <text x="80" y="172" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11">▲ 18.4% vs last mo</text>

    <!-- Metrics card 2 -->
    <rect x="220" y="95" width="140" height="90" rx="8" fill="#123328" stroke="#195442" />
    <text x="235" y="120" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="11">Green Score</text>
    <text x="235" y="152" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="22">89 / 100</text>
    <text x="235" y="172" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11">★ Level 4 EcoHero</text>

    <!-- Circular Progress Gauge on the right -->
    <rect x="375" y="95" width="165" height="205" rx="8" fill="#0e281f" stroke="#195442" />
    <text x="457" y="125" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Goal Completion</text>
    <circle cx="457" cy="185" r="45" fill="none" stroke="#195442" stroke-width="10" />
    <circle cx="457" cy="185" r="45" fill="none" stroke="url(#greenGauge)" stroke-width="10" stroke-dasharray="282" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90 457 185)" />
    <text x="457" y="192" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">77%</text>
    <text x="457" y="260" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Renewable Energy</text>
    <text x="457" y="278" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">+ 4 daily trees planted</text>

    <!-- Bar Chart preview at bottom left -->
    <rect x="65" y="200" width="295" height="100" rx="8" fill="#123328" stroke="#195442" />
    <text x="80" y="222" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="11">Weekly Energy Consumption (kWh)</text>
    
    <!-- Bars -->
    <rect x="85" y="255" width="22" height="32" rx="3" fill="#10b981" />
    <rect x="125" y="245" width="22" height="42" rx="3" fill="#10b981" />
    <rect x="165" y="260" width="22" height="27" rx="3" fill="#10b981" />
    <rect x="205" y="235" width="22" height="52" rx="3" fill="#34d399" />
    <rect x="245" y="250" width="22" height="37" rx="3" fill="#10b981" />
    <rect x="285" y="240" width="22" height="47" rx="3" fill="#10b981" />
    <rect x="325" y="230" width="22" height="57" rx="3" fill="#34d399" />
  </g>
</svg>
