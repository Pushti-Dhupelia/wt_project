<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGrad6)" />

  <g filter="url(#shadow6)">
    <rect x="40" y="35" width="520" height="290" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="40" y="35" width="520" height="42" rx="12" fill="#1e293b" />
    <circle cx="65" cy="56" r="5" fill="#ef4444" />
    <circle cx="81" cy="56" r="5" fill="#f59e0b" />
    <circle cx="97" cy="56" r="5" fill="#10b981" />
    <text x="130" y="61" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">☁️ SkyPulse Weather &amp; Air Quality</text>
    
    <!-- Weather Widget Left -->
    <rect x="65" y="95" width="230" height="205" rx="10" fill="#1e293b" stroke="#334155" />
    <circle cx="115" cy="145" r="28" fill="url(#sunGrad)" />
    <text x="160" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="34">28°C</text>
    <text x="80" y="200" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16">Sunny &amp; Clear</text>
    <text x="80" y="222" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Humidity: 48% • Wind: 12 km/h</text>
    <rect x="80" y="245" width="130" height="28" rx="14" fill="#0284c7" />
    <text x="145" y="263" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Air Quality: Good (38)</text>

    <!-- 4 Day Forecast on Right -->
    <rect x="315" y="95" width="225" height="205" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="335" y="122" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12">5-DAY FORECAST</text>
    
    <text x="335" y="150" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Mon • Sunny</text>
    <text x="515" y="150" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="end">29° / 20°</text>

    <text x="335" y="180" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Tue • Cloudy</text>
    <text x="515" y="180" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="end">26° / 18°</text>

    <text x="335" y="210" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Wed • Light Rain</text>
    <text x="515" y="210" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="end">23° / 17°</text>

    <text x="335" y="240" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Thu • Clear Sky</text>
    <text x="515" y="240" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="end">28° / 19°</text>

    <text x="335" y="270" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">Fri • Sunny</text>
    <text x="515" y="270" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="end">30° / 21°</text>
  </g>
</svg>
