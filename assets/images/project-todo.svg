<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="todoProgress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="todoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#todoBg)" />
  <circle cx="500" cy="90" r="110" fill="#10b981" opacity="0.12" filter="blur(30px)" />
  <circle cx="90" cy="270" r="100" fill="#06b6d4" opacity="0.1" filter="blur(30px)" />

  <g filter="url(#todoShadow)">
    <rect x="40" y="30" width="520" height="300" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- Top header bar -->
    <path d="M 40 44 Q 40 30 54 30 L 546 30 Q 560 30 560 44 L 560 76 L 40 76 Z" fill="#1e293b" />
    <circle cx="65" cy="53" r="5" fill="#ef4444" />
    <circle cx="81" cy="53" r="5" fill="#f59e0b" />
    <circle cx="97" cy="53" r="5" fill="#10b981" />
    <text x="122" y="58" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">⚡ Productivity Hub • Dynamic Task List</text>
    
    <!-- Filter tabs -->
    <rect x="360" y="44" width="50" height="20" rx="10" fill="#10b981" />
    <text x="385" y="58" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">All (5)</text>

    <rect x="418" y="44" width="60" height="20" rx="10" fill="#334155" />
    <text x="448" y="58" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Active (2)</text>

    <rect x="486" y="44" width="60" height="20" rx="10" fill="#334155" />
    <text x="516" y="58" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Done (3)</text>

    <!-- Progress bar -->
    <rect x="60" y="90" width="480" height="6" rx="3" fill="#334155" />
    <rect x="60" y="90" width="312" height="6" rx="3" fill="url(#todoProgress)" />
    <text x="60" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Tasks Completion: <tspan fill="#34d399" font-weight="bold">65% Completed</tspan> • LocalStorage Synced</text>

    <!-- Task Item 1 (Completed) -->
    <rect x="60" y="125" width="480" height="42" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="75" y="137" width="18" height="18" rx="5" fill="#10b981" />
    <text x="84" y="150" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
    <text x="105" y="151" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12" text-decoration="line-through">Submit Data Structures &amp; Algorithms Assignment</text>
    <rect x="430" y="136" width="60" height="20" rx="4" fill="#10b981" fill-opacity="0.15" />
    <text x="460" y="150" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Academic</text>
    <text x="520" y="151" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🗑️</text>

    <!-- Task Item 2 (Completed) -->
    <rect x="60" y="175" width="480" height="42" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="75" y="187" width="18" height="18" rx="5" fill="#10b981" />
    <text x="84" y="200" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
    <text x="105" y="201" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="12" text-decoration="line-through">Design Responsive Portfolio UI Components</text>
    <rect x="430" y="186" width="60" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15" />
    <text x="460" y="200" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Frontend</text>
    <text x="520" y="201" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🗑️</text>

    <!-- Task Item 3 (Active) -->
    <rect x="60" y="225" width="480" height="42" rx="8" fill="#1e293b" stroke="#4f46e5" stroke-width="1.2" />
    <rect x="75" y="237" width="18" height="18" rx="5" fill="#0f172a" stroke="#64748b" />
    <text x="105" y="251" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Connect FastAPI REST endpoints with SQLAlchemy models</text>
    <rect x="430" y="236" width="60" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15" />
    <text x="460" y="250" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Backend</text>
    <text x="520" y="251" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🗑️</text>

    <!-- Task Input Bar at bottom -->
    <rect x="60" y="278" width="370" height="36" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="75" y="301" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11.5">Add a new task (e.g., Learn Git rebase)...</text>
    <rect x="440" y="278" width="100" height="36" rx="6" fill="#10b981" />
    <text x="490" y="300" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">+ Add Task</text>
  </g>
</svg>
