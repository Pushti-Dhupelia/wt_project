    <rect x="55" y="254" width="130" height="34" rx="6" fill="url(#regAccent)" />
    <text x="120" y="275" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Register Student</text>

    <rect x="195" y="254" width="95" height="34" rx="6" fill="#334155" />
    <text x="242" y="275" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">Reset Form</text>

    <rect x="310" y="254" width="235" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="427" y="275" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">⚡ Real-time JS Regex &amp; Event Listeners</text>
