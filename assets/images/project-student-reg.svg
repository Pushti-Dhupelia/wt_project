<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="regBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="regAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="regGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#regBg)" />
  <circle cx="530" cy="70" r="100" fill="#4f46e5" opacity="0.12" filter="blur(20px)" />
  <circle cx="70" cy="300" r="90" fill="#06b6d4" opacity="0.1" filter="blur(20px)" />

  <!-- Window Container -->
  <g filter="url(#regGlow)">
    <rect x="35" y="30" width="530" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 35 42 Q 35 30 47 30 L 553 30 Q 565 30 565 42 L 565 72 L 35 72 Z" fill="#0f172a" />
    <circle cx="58" cy="51" r="5" fill="#ef4444" />
    <circle cx="74" cy="51" r="5" fill="#f59e0b" />
    <circle cx="90" cy="51" r="5" fill="#10b981" />
    <text x="115" y="56" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🎓 Student Registration Portal • Client Validation</text>
    <rect x="440" y="42" width="105" height="18" rx="9" fill="#10b981" fill-opacity="0.15" />
    <text x="492" y="55" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Validation OK</text>

    <!-- Form Content Left -->
    <rect x="55" y="90" width="235" height="42" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="65" y="106" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Full Name</text>
    <text x="65" y="122" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Pushti Dhupelia</text>
    <circle cx="275" cy="111" r="7" fill="#10b981" fill-opacity="0.2" />
    <text x="275" y="114" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">✓</text>

    <rect x="55" y="142" width="235" height="42" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="65" y="158" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Enrollment / Roll ID</text>
    <text x="65" y="174" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">IU23CSE042</text>
    <circle cx="275" cy="163" r="7" fill="#10b981" fill-opacity="0.2" />
    <text x="275" y="166" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">✓</text>

    <rect x="55" y="194" width="235" height="42" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="65" y="210" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Email Address</text>
    <text x="65" y="226" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">pushti.cse@indusuni.ac.in</text>
    <circle cx="275" cy="215" r="7" fill="#10b981" fill-opacity="0.2" />
    <text x="275" y="218" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">✓</text>

    <!-- Form Content Right: ID Card Preview -->
    <rect x="310" y="90" width="235" height="146" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2" />
    <rect x="310" y="90" width="235" height="28" rx="8" fill="url(#regAccent)" />
    <text x="325" y="108" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">INDUS UNIVERSITY ID PREVIEW</text>
    
    <circle cx="345" cy="155" r="22" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.5" />
    <text x="345" y="160" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PD</text>

    <text x="380" y="145" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Pushti Dhupelia</text>
    <text x="380" y="162" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">B.Tech Computer Science</text>
    <text x="380" y="177" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10">Batch: 2023 – 2027</text>

    <rect x="325" y="196" width="205" height="24" rx="4" fill="#1e293b" />
    <text x="335" y="212" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Status: Verified &amp; Registered</text>

