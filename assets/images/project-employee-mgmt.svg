<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="empBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="empAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="empShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#empBg)" />
  <circle cx="510" cy="70" r="110" fill="#059669" opacity="0.12" filter="blur(30px)" />
  <circle cx="90" cy="280" r="90" fill="#3b82f6" opacity="0.12" filter="blur(30px)" />

  <g filter="url(#empShadow)">
    <rect x="35" y="28" width="530" height="304" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5" />

    <!-- Top header bar -->
    <path d="M 35 40 Q 35 28 47 28 L 553 28 Q 565 28 565 40 L 565 70 L 35 70 Z" fill="#1f2937" />
    <circle cx="55" cy="49" r="5" fill="#ef4444" />
    <circle cx="71" cy="49" r="5" fill="#f59e0b" />
    <circle cx="87" cy="49" r="5" fill="#10b981" />
    <text x="110" y="53" fill="#f9fafb" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">⚡ FastAPI Enterprise • Employee &amp; Dept Directory</text>

    <!-- Status tags -->
    <rect x="420" y="39" width="65" height="20" rx="4" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
    <text x="452" y="53" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">JWT AUTH</text>

    <rect x="492" y="39" width="62" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="0.8" />
    <text x="523" y="53" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PGSQL 16</text>

    <!-- Sub-header stats row -->
    <g transform="translate(50, 82)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#1f2937" />
      <text x="10" y="18" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5">TOTAL EMPLOYEES</text>
      <text x="10" y="35" fill="#f9fafb" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">148 Staff</text>

      <rect x="125" y="0" width="115" height="42" rx="6" fill="#1f2937" />
      <text x="135" y="18" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5">DEPARTMENTS</text>
      <text x="135" y="35" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">8 Units</text>

      <rect x="250" y="0" width="115" height="42" rx="6" fill="#1f2937" />
      <text x="260" y="18" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5">ACTIVE ROLES</text>
      <text x="260" y="35" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">Admin / Staff</text>

      <rect x="375" y="0" width="125" height="42" rx="6" fill="#1f2937" />
      <text x="385" y="18" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5">API LATENCY</text>
      <text x="385" y="35" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">14ms (Async)</text>
    </g>

    <!-- Data Table -->
    <g transform="translate(50, 136)">
      <!-- Table Header -->
      <rect x="0" y="0" width="500" height="24" rx="4" fill="#1f2937" />
      <text x="12" y="16" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold">EMP ID</text>
      <text x="75" y="16" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold">EMPLOYEE NAME</text>
      <text x="195" y="16" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold">ROLE / POSITION</text>
      <text x="320" y="16" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold">DEPARTMENT</text>
      <text x="440" y="16" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold">STATUS</text>

      <!-- Row 1 -->
      <rect x="0" y="28" width="500" height="32" rx="4" fill="#161e2e" />
      <text x="12" y="48" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600">EMP-101</text>
      <text x="75" y="48" fill="#f9fafb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Devang Dave</text>
      <text x="195" y="48" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="10.5">Lead Software Dev</text>
      <text x="320" y="48" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="10.5">Engineering</text>
      <rect x="430" y="34" width="58" height="18" rx="9" fill="#059669" fill-opacity="0.2" />
      <text x="459" y="47" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACTIVE</text>

      <!-- Row 2 -->
      <rect x="0" y="64" width="500" height="32" rx="4" fill="#111827" />
      <text x="12" y="84" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600">EMP-102</text>
      <text x="75" y="84" fill="#f9fafb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Rhea Sen</text>
      <text x="195" y="84" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="10.5">Database Architect</text>
      <text x="320" y="84" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="10.5">Data Platforms</text>
      <rect x="430" y="70" width="58" height="18" rx="9" fill="#059669" fill-opacity="0.2" />
      <text x="459" y="83" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACTIVE</text>

      <!-- Row 3 -->
      <rect x="0" y="100" width="500" height="32" rx="4" fill="#161e2e" />
      <text x="12" y="120" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600">EMP-103</text>
      <text x="75" y="120" fill="#f9fafb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Tanvi Mehta</text>
      <text x="195" y="120" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="10.5">Security Analyst</text>
      <text x="320" y="120" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="10.5">InfoSec</text>
      <rect x="430" y="106" width="58" height="18" rx="9" fill="#f59e0b" fill-opacity="0.2" />
      <text x="459" y="119" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">LEAVE</text>

      <!-- Row 4 -->
      <rect x="0" y="136" width="500" height="32" rx="4" fill="#111827" />
      <text x="12" y="156" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600">EMP-104</text>
      <text x="75" y="156" fill="#f9fafb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Karan Parekh</text>
      <text x="195" y="156" fill="#d1d5db" font-family="'Segoe UI', sans-serif" font-size="10.5">DevOps Engineer</text>
      <text x="320" y="156" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="10.5">Infrastructure</text>
      <rect x="430" y="142" width="58" height="18" rx="9" fill="#059669" fill-opacity="0.2" />
      <text x="459" y="155" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACTIVE</text>
    </g>

    <!-- Bottom API status bar -->
    <rect x="50" y="310" width="500" height="12" rx="2" fill="none" />
  </g>
</svg>
