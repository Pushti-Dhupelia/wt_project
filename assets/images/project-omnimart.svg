<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f2b38" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#06b6d4" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGrad2)" />

  <!-- E-commerce Store Mockup -->
  <g filter="url(#shadow2)">
    <rect x="40" y="35" width="520" height="290" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    
    <!-- Navbar bar -->
    <rect x="40" y="35" width="520" height="42" rx="12" fill="#1e293b" />
    <circle cx="65" cy="56" r="5" fill="#f87171" />
    <circle cx="81" cy="56" r="5" fill="#fbbf24" />
    <circle cx="97" cy="56" r="5" fill="#34d399" />
    <text x="130" y="60" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">OmniMart⚡</text>
    
    <!-- Search pill -->
    <rect x="230" y="44" width="180" height="24" rx="12" fill="#0f172a" />
    <text x="250" y="60" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Search products...</text>
    
    <!-- Cart Pill -->
    <rect x="440" y="44" width="100" height="24" rx="12" fill="url(#cartGrad)" />
    <text x="490" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Cart: 3 items</text>

    <!-- Product 1 Card -->
    <rect x="60" y="95" width="140" height="205" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="70" y="105" width="120" height="85" rx="6" fill="#0f172a" />
    <circle cx="130" cy="147" r="28" fill="#38bdf8" fill-opacity="0.15" />
    <text x="130" y="153" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle">🎧</text>
    <text x="72" y="210" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">AirPulse Pro</text>
    <text x="72" y="228" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Active Noise Cancel</text>
    <text x="72" y="255" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">$149</text>
    <rect x="72" y="265" width="116" height="24" rx="5" fill="#0284c7" />
    <text x="130" y="281" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

    <!-- Product 2 Card -->
    <rect x="220" y="95" width="140" height="205" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="230" y="105" width="120" height="85" rx="6" fill="#0f172a" />
    <circle cx="290" cy="147" r="28" fill="#a855f7" fill-opacity="0.15" />
    <text x="290" y="153" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle">⌚</text>
    <text x="232" y="210" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">FitTrack X2</text>
    <text x="232" y="228" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">AMOLED • GPS Sync</text>
    <text x="232" y="255" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">$199</text>
    <rect x="232" y="265" width="116" height="24" rx="5" fill="#0284c7" />
    <text x="290" y="281" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

    <!-- Cart Drawer Preview on the right -->
    <rect x="380" y="95" width="160" height="205" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="395" y="120" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">Shopping Cart</text>
    <rect x="395" y="132" width="130" height="35" rx="5" fill="#1e293b" />
    <text x="405" y="148" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">AirPulse Pro (1x)</text>
    <text x="405" y="161" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">$149.00</text>

    <rect x="395" y="174" width="130" height="35" rx="5" fill="#1e293b" />
    <text x="405" y="190" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">FitTrack X2 (1x)</text>
    <text x="405" y="203" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">$199.00</text>

    <line x1="395" y1="220" x2="525" y2="220" stroke="#334155" />
    <text x="395" y="240" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Subtotal: <tspan fill="#ffffff" font-weight="bold">$348.00</tspan></text>
    <rect x="395" y="255" width="130" height="28" rx="6" fill="#10b981" />
    <text x="460" y="273" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Checkout ➔</text>
  </g>
</svg>
