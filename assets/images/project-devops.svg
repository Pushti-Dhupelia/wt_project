<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="devopsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="devopsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#devopsBg)" />
  <circle cx="150" cy="80" r="100" fill="#6366f1" opacity="0.12" filter="blur(30px)" />
  <circle cx="480" cy="270" r="100" fill="#10b981" opacity="0.12" filter="blur(35px)" />

  <!-- Main Pipeline Dashboard Card -->
  <g filter="url(#devopsShadow)" transform="translate(60, 30)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="480" height="295" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="480" height="36" rx="14" fill="#1e293b" />
    <path d="M 0 24 L 0 36 L 480 36 L 480 24 Z" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="75" y="22" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">workflow / ci-cd-pipeline.yml</text>

    <!-- Branch Status -->
    <rect x="25" y="52" width="430" height="42" rx="8" fill="#111827" stroke="#1f2937" />
    <circle cx="45" cy="73" r="5" fill="#6366f1" />
    <text x="60" y="77" fill="#f3f4f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">branch: main</text>
    <text x="165" y="77" fill="#9ca3af" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">commit 7a3f82e</text>
    <rect x="360" y="60" width="80" height="24" rx="12" fill="#065f46" stroke="#059669" />
    <text x="400" y="76" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✔ Passed</text>

    <!-- CI / CD Pipeline Stages -->
    <text x="25" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="10">PIPELINE EXECUTION STAGES</text>

    <!-- Stage 1: Lint & Verify -->
    <rect x="25" y="130" width="98" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="42" cy="148" r="8" fill="#10b981" />
    <text x="42" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✓</text>
    <text x="56" y="152" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Lint Code</text>
    <text x="35" y="174" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">14s • clean</text>

    <!-- Connector 1 -->
    <line x1="123" y1="162" x2="135" y2="162" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Stage 2: Unit Tests -->
    <rect x="135" y="130" width="98" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="152" cy="148" r="8" fill="#10b981" />
    <text x="152" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✓</text>
    <text x="166" y="152" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Automated Test</text>
    <text x="145" y="174" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">38s • 42 passed</text>

    <!-- Connector 2 -->
    <line x1="233" y1="162" x2="245" y2="162" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Stage 3: Container Build -->
    <rect x="245" y="130" width="98" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="262" cy="148" r="8" fill="#10b981" />
    <text x="262" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✓</text>
    <text x="276" y="152" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Docker Build</text>
    <text x="255" y="174" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">52s • v1.4.0</text>

    <!-- Connector 3 -->
    <line x1="343" y1="162" x2="355" y2="162" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Stage 4: Deploy -->
    <rect x="355" y="130" width="100" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="372" cy="148" r="8" fill="#10b981" />
    <text x="372" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">✓</text>
    <text x="386" y="152" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Deploy Live</text>
    <text x="365" y="174" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">22s • healthy</text>

    <!-- Git Log Console -->
    <rect x="25" y="210" width="430" height="68" rx="8" fill="#030712" stroke="#1f2937" />
    <text x="40" y="230" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">git checkout -b feature/workflow-automation</text>
    <text x="40" y="247" fill="#60a5fa" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">git commit -m "feat(ci): add automated test &amp; lint workflows"</text>
    <text x="40" y="264" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">git push origin main  ➜  Deployment triggered via GitHub Actions</text>
  </g>
</svg>
