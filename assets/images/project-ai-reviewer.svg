<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="chipGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad1)" />

  <!-- Code Editor Window -->
  <g filter="url(#shadow1)">
    <rect x="40" y="35" width="520" height="290" rx="12" fill="#181825" stroke="#313244" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="40" y="35" width="520" height="38" rx="12" fill="#11111b" />
    <circle cx="65" cy="54" r="5.5" fill="#f38ba8" />
    <circle cx="83" cy="54" r="5.5" fill="#f9e2af" />
    <circle cx="101" cy="54" r="5.5" fill="#a6e3a1" />
    <text x="300" y="59" fill="#a6adc8" font-family="'Consolas', monospace" font-size="12" text-anchor="middle">AI_Code_Reviewer.js — Pushti Dev</text>
    
    <!-- Code Lines -->
    <text x="65" y="105" fill="#cdd6f4" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#cba6f7">async function </tspan><tspan fill="#89b4fa">analyzeCodeSyntax</tspan>(<tspan fill="#fab387">codeSnippet</tspan>) {
    </text>
    <text x="85" y="132" fill="#cdd6f4" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#cba6f7">const </tspan><tspan fill="#f9e2af">analysis </tspan><tspan fill="#89dceb">= await </tspan><tspan fill="#a6e3a1">AIModel.evaluate</tspan>(codeSnippet);
    </text>
    <text x="85" y="159" fill="#cdd6f4" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#cba6f7">return </tspan>{ <tspan fill="#fab387">score</tspan>: <tspan fill="#a6e3a1">"98%"</tspan>, <tspan fill="#fab387">complexity</tspan>: <tspan fill="#a6e3a1">"O(n log n)"</tspan> };
    </text>
    <text x="65" y="186" fill="#cdd6f4" font-family="'Consolas', monospace" font-size="13">}</text>

    <!-- AI Floating Inspection Card -->
    <rect x="230" y="180" width="310" height="125" rx="10" fill="#1e1e2e" stroke="url(#glowGrad1)" stroke-width="2" />
    <rect x="245" y="195" width="90" height="22" rx="11" fill="url(#chipGrad1)" />
    <text x="290" y="210" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✓ AI OPTIMIZED</text>
    
    <text x="245" y="238" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">Complexity: Optimal O(n)</text>
    <text x="245" y="258" fill="#a6adc8" font-family="'Segoe UI', sans-serif" font-size="11.5">No memory leaks detected • ES6+ Standards</text>
    <text x="245" y="278" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11.5">Recommendation: Clean async structure applied</text>
    
    <!-- Code Accent Badge -->
    <rect x="65" y="240" width="140" height="60" rx="8" fill="#252538" />
    <text x="135" y="265" fill="#f38ba8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">98.5%</text>
    <text x="135" y="285" fill="#a6adc8" font-family="'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Code Quality Score</text>
  </g>
</svg>
