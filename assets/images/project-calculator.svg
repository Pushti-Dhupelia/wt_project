<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="calcBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="calcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#calcBg)" />
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.12" filter="blur(30px)" />
  <circle cx="480" cy="280" r="100" fill="#ec4899" opacity="0.1" filter="blur(30px)" />

  <g filter="url(#calcShadow)">
    <!-- Main Shell -->
    <rect x="180" y="25" width="240" height="310" rx="20" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Speaker / Notch -->
    <rect x="270" y="32" width="60" height="4" rx="2" fill="#27272a" />

    <!-- Screen -->
    <rect x="195" y="45" width="210" height="70" rx="10" fill="#18181b" stroke="#27272a" />
    <text x="395" y="65" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="11" text-anchor="end">1,024 × 8</text>
    <text x="395" y="100" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="26" text-anchor="end">8,192</text>

    <!-- Row 1 -->
    <rect x="195" y="125" width="46" height="34" rx="8" fill="#27272a" />
    <text x="218" y="146" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AC</text>

    <rect x="250" y="125" width="46" height="34" rx="8" fill="#27272a" />
    <text x="273" y="146" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">±</text>

    <rect x="304" y="125" width="46" height="34" rx="8" fill="#27272a" />
    <text x="327" y="146" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">%</text>

    <rect x="359" y="125" width="46" height="34" rx="8" fill="url(#calcBtnGrad)" />
    <text x="382" y="146" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">÷</text>

    <!-- Row 2 -->
    <rect x="195" y="167" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="218" y="188" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">7</text>

    <rect x="250" y="167" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="273" y="188" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">8</text>

    <rect x="304" y="167" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="327" y="188" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">9</text>

    <rect x="359" y="167" width="46" height="34" rx="8" fill="url(#calcBtnGrad)" />
    <text x="382" y="188" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">×</text>

    <!-- Row 3 -->
    <rect x="195" y="209" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="218" y="230" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">4</text>

    <rect x="250" y="209" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="273" y="230" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">5</text>

    <rect x="304" y="209" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="327" y="230" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">6</text>

    <rect x="359" y="209" width="46" height="34" rx="8" fill="url(#calcBtnGrad)" />
    <text x="382" y="230" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">−</text>

    <!-- Row 4 -->
    <rect x="195" y="251" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="218" y="272" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">1</text>

    <rect x="250" y="251" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="273" y="272" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">2</text>

    <rect x="304" y="251" width="46" height="34" rx="8" fill="#1c1917" />
    <text x="327" y="272" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">3</text>

    <rect x="359" y="251" width="46" height="34" rx="8" fill="url(#calcBtnGrad)" />
    <text x="382" y="272" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+</text>

    <!-- Row 5 -->
    <rect x="195" y="293" width="101" height="32" rx="8" fill="#1c1917" />
    <text x="245" y="313" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">0</text>

    <rect x="304" y="293" width="46" height="32" rx="8" fill="#1c1917" />
    <text x="327" y="313" fill="#fafafa" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">.</text>

    <rect x="359" y="293" width="46" height="32" rx="8" fill="#10b981" />
    <text x="382" y="313" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">=</text>
  </g>

  <!-- Side Feature Callouts -->
  <g>
    <rect x="40" y="70" width="120" height="50" rx="8" fill="#18181b" stroke="#3f3f46" />
    <text x="50" y="88" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Keyboard Support</text>
    <text x="50" y="105" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9.5">Event key listening</text>

    <rect x="40" y="140" width="120" height="50" rx="8" fill="#18181b" stroke="#3f3f46" />
    <text x="50" y="158" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Decimal Logic</text>
    <text x="50" y="175" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9.5">Precision validation</text>

    <rect x="440" y="100" width="125" height="50" rx="8" fill="#18181b" stroke="#3f3f46" />
    <text x="450" y="118" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Error Boundary</text>
    <text x="450" y="135" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9.5">Division by 0 check</text>

    <rect x="440" y="170" width="125" height="50" rx="8" fill="#18181b" stroke="#3f3f46" />
    <text x="450" y="188" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">CSS Grid UI</text>
    <text x="450" y="205" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9.5">Responsive layout</text>
  </g>
</svg>
