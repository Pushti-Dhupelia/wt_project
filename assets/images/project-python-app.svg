<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="pyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#pyBg)" />
  <circle cx="100" cy="80" r="90" fill="#0284c7" opacity="0.12" filter="blur(30px)" />
  <circle cx="500" cy="280" r="110" fill="#f59e0b" opacity="0.12" filter="blur(35px)" />

  <!-- Code Editor Window -->
  <g filter="url(#pyShadow)" transform="translate(60, 30)">
    <!-- Window Container -->
    <rect x="0" y="0" width="480" height="295" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="480" height="36" rx="14" fill="#1e293b" />
    <path d="M 0 24 L 0 36 L 480 36 L 480 24 Z" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    
    <!-- Tab -->
    <rect x="80" y="6" width="130" height="24" rx="6" fill="#0b0f19" />
    <circle cx="95" cy="18" r="4" fill="#38bdf8" />
    <text x="106" y="22" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">data_algo.py</text>

    <!-- Editor Body Lines -->
    <g transform="translate(25, 55)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#64748b">01</text>
      <text x="35" y="0">
        <tspan fill="#f43f5e">import</tspan> <tspan fill="#e2e8f0">sys, math, json</tspan>
      </text>

      <!-- Line 2 -->
      <text x="0" y="24" fill="#64748b">02</text>
      <text x="35" y="24">
        <tspan fill="#f43f5e">class</tspan> <tspan fill="#fbbf24">DataProcessor</tspan><tspan fill="#e2e8f0">:</tspan>
      </text>

      <!-- Line 3 -->
      <text x="0" y="48" fill="#64748b">03</text>
      <text x="35" y="48">
        <tspan fill="#64748b">    # Problem solving &amp; fundamental data pipelines</tspan>
      </text>

      <!-- Line 4 -->
      <text x="0" y="72" fill="#64748b">04</text>
      <text x="35" y="72">
        <tspan fill="#f43f5e">    def</tspan> <tspan fill="#38bdf8">optimize_records</tspan><tspan fill="#e2e8f0">(self, dataset):</tspan>
      </text>

      <!-- Line 5 -->
      <text x="0" y="96" fill="#64748b">05</text>
      <text x="35" y="96">
        <tspan fill="#e2e8f0">        cleaned = [item </tspan><tspan fill="#f43f5e">for</tspan><tspan fill="#e2e8f0"> item </tspan><tspan fill="#f43f5e">in</tspan><tspan fill="#e2e8f0"> dataset </tspan><tspan fill="#f43f5e">if</tspan><tspan fill="#e2e8f0"> item.valid]</tspan>
      </text>

      <!-- Line 6 -->
      <text x="0" y="120" fill="#64748b">06</text>
      <text x="35" y="120">
        <tspan fill="#f43f5e">        return</tspan> <tspan fill="#34d399">sorted</tspan><tspan fill="#e2e8f0">(cleaned, key=</tspan><tspan fill="#f43f5e">lambda</tspan><tspan fill="#e2e8f0"> x: x.score)</tspan>
      </text>
    </g>

    <!-- Interactive Terminal Output Box -->
    <rect x="25" y="195" width="430" height="80" rx="8" fill="#030712" stroke="#1e293b" />
    <text x="40" y="215" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">➜ python data_algo.py --run</text>
    <text x="40" y="234" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">[INFO] Processing 1,500 data structures...</text>
    <text x="40" y="253" fill="#a3e635" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">✔ Execution finished in 0.042s (Memory O(n))</text>
  </g>

  <!-- Python Floating Pill -->
  <g transform="translate(460, 45)">
    <rect width="90" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#38bdf8" />
    <text x="28" y="21" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">Python</text>
  </g>
</svg>
